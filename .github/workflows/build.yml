name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            icon: icon.icns
            onefile: ''
          - os: windows-latest
            icon: icon.ico
            onefile: '--onefile'
          - os: ubuntu-latest
            icon: icon.png
            onefile: '--onefile'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller ${{ matrix.onefile }} --windowed --noconfirm --clean \
            --name ai-model-prober --icon ${{ matrix.icon }} \
            --collect-all openai \
            --collect-all aiohttp \
            --collect-all cryptography \
            --collect-all dotenv \
            probe_models_gui.py

      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/ai-model-prober-macos-${{ runner.arch }}.tar.gz" -C dist ai-model-prober.app

      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path dist/ai-model-prober.exe -DestinationPath "release-assets/ai-model-prober-windows-${{ runner.arch }}.zip"

      - name: Archive Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/ai-model-prober-linux-${{ runner.arch }}.tar.gz" -C dist ai-model-prober

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-prober-${{ matrix.os }}
          path: dist/

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
