name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            icon: icon.icns
            onefile: ''
          - os: windows-latest
            icon: icon.ico
            onefile: '--onefile'
          - os: ubuntu-latest
            icon: icon.png
            onefile: '--onefile'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller ${{ matrix.onefile }} --windowed --noconfirm --clean \
            --name ai-model-prober --icon ${{ matrix.icon }} \
            --collect-all openai \
            --collect-all aiohttp \
            --collect-all cryptography \
            --collect-all dotenv \
            probe_models_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-prober-${{ matrix.os }}
          path: dist/
