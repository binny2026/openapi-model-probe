name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            icon: icon.icns
            onefile: ''
          - os: windows-latest
            icon: icon.ico
            onefile: '--onefile'
          - os: ubuntu-latest
            icon: icon.png
            onefile: '--onefile'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller ${{ matrix.onefile }} --windowed --noconfirm --clean \
            --name ai-model-prober --icon ${{ matrix.icon }} \
            --collect-all openai \
            --collect-all aiohttp \
            --collect-all cryptography \
            --collect-all dotenv \
            probe_models_gui.py

      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/ai-model-prober-macos-${{ runner.arch }}.tar.gz" -C dist ai-model-prober.app

      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path dist/ai-model-prober.exe -DestinationPath "release-assets/ai-model-prober-windows-${{ runner.arch }}.zip"

      - name: Archive Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/ai-model-prober-linux-${{ runner.arch }}.tar.gz" -C dist ai-model-prober

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-prober-${{ matrix.os }}
          path: dist/

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          current_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          previous_tag=''
          if git rev-parse --verify "${current_commit}^" >/dev/null 2>&1; then
            previous_tag=$(git describe --tags --match 'v*' --abbrev=0 "${current_commit}^" 2>/dev/null || true)
          fi
          range="$current_commit"
          if [ -n "$previous_tag" ]; then
            range="refs/tags/${previous_tag}..${current_commit}"
          fi
          {
            printf '## 更新提交\n\n'
            git log --reverse --format="- %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" "$range" --
            printf '\n'
            if [ -n "$previous_tag" ]; then
              printf '**Full Changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG"
            else
              printf '**Full Changelog**: %s/%s/commits/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
